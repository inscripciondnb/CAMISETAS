<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Camisetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Staatliches&display=swap" rel="stylesheet">
<style>
:root{--c:#16110E;--c2:#201914;--r:#C8272D;--ro:#8E1B20;--g:#D4A94E;--gs:#E6C77E;--t:#F3EADB;--m:#9A8D7E;--l:rgba(212,169,78,.25)}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font-family:Barlow,sans-serif}.shell{max-width:1180px;margin:auto;padding:22px}.hero{border-top:8px solid var(--r);border-bottom:3px solid var(--g);padding:25px 0}.hero h1{font-family:Staatliches;font-weight:400;font-size:2.5rem;margin:0}.hero p{color:var(--m);margin:4px 0 0}.card{margin-top:18px;background:var(--c2);border:1px solid var(--l);border-top:4px solid var(--r);padding:16px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}input{background:var(--c);border:1px solid var(--l);color:var(--t);padding:11px}.btn{border:0;background:linear-gradient(160deg,var(--r),var(--ro));border-bottom:3px solid var(--g);color:#fff;padding:11px 18px;font-family:Staatliches;font-size:1rem;letter-spacing:.08em;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{border:1px solid var(--l);background:var(--c);padding:12px}.stat strong{font-family:Staatliches;color:var(--gs);font-size:1.7rem;display:block}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:900px}th{background:var(--c);color:var(--gs);text-transform:uppercase;font-size:.75rem;padding:10px;border-bottom:2px solid var(--g);text-align:left}td{padding:10px;border-bottom:1px solid var(--l);font-size:.9rem;vertical-align:top}a{color:var(--gs)}.tag{display:inline-block;border:1px solid var(--l);padding:3px 6px;margin:2px;color:var(--gs)}.muted{color:var(--m)}@media(max-width:700px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.shell{padding:10px}}
</style>
</head>
<body><div class="shell"><div class="hero"><h1>Pedidos de camisetas</h1><p>Copa Integración · Panel administrativo</p></div>
<div class="card"><div class="controls"><input id="key" type="password" placeholder="Clave de administrador"><button id="load" class="btn">Cargar pedidos</button></div><div id="stats" class="stats" style="display:none"></div><div id="msg" class="muted" style="margin-top:10px"></div><div class="tablewrap"><table id="table" style="display:none"><thead><tr><th>Fecha</th><th>Código</th><th>Nombre</th><th>Pedido</th><th>Total</th><th>Comprobante</th></tr></thead><tbody></tbody></table></div></div></div>
<script>
const API_URL='PEGAR_AQUI_URL_APPS_SCRIPT';const $=id=>document.getElementById(id);
$('load').onclick=async()=>{const key=$('key').value.trim();if(!key){$('msg').textContent='Ingresá la clave de administrador.';return}if(API_URL.includes('PEGAR_AQUI')){$('msg').textContent='Falta configurar la URL de Apps Script.';return}$('msg').textContent='Cargando...';try{const u=new URL(API_URL);u.searchParams.set('accion','listar_pedidos');u.searchParams.set('key',key);const r=await fetch(u,{cache:'no-store'});const d=await r.json();if(!d.ok)throw new Error(d.error||'Error');render(d.pedidos||[])}catch(e){$('msg').textContent=e.message}}
function render(rows){$('msg').textContent=rows.length?`${rows.length} pedidos cargados.`:'No hay pedidos.';const total=rows.reduce((s,r)=>s+Number(r.total||0),0);const talles={};rows.forEach(r=>(r.items||[]).forEach(i=>talles[i.talle]=(talles[i.talle]||0)+Number(i.cantidad||0)));$('stats').style.display='grid';$('stats').innerHTML=`<div class="stat"><strong>${rows.length}</strong><span>Pedidos</span></div><div class="stat"><strong>${total}</strong><span>Camisetas</span></div><div class="stat"><strong>${Object.keys(talles).length}</strong><span>Talles utilizados</span></div><div class="stat"><strong>${Object.entries(talles).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}</strong><span>Talle más pedido</span></div>`;const tb=$('table').querySelector('tbody');tb.innerHTML=rows.map(r=>`<tr><td>${esc(r.fecha||'')}</td><td>${esc(r.codigo||'')}</td><td><strong>${esc(r.nombre||'')} ${esc(r.apellido||'')}</strong></td><td>${(r.items||[]).map(i=>`<span class="tag">${esc(i.talle)} × ${Number(i.cantidad||0)}</span>`).join('')}</td><td>${Number(r.total||0)}</td><td>${r.comprobanteUrl?`<a href="${r.comprobanteUrl}" target="_blank" rel="noopener">Ver comprobante</a>`:'—'}</td></tr>`).join('');$('table').style.display='table'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
